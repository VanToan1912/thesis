services:
  db:
    image: postgres:16-alpine
    container_name: ridewithme-db
    environment:
      POSTGRES_DB: ridewithme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ridewithme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ridewithme"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: ridewithme-server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ridewithme}
      PORT: ${PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace.apps.googleusercontent.com}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-replace}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-replace}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-replace}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-ridewithme://payment-return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:4000/vnpay/ipn}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - ridewithme_node_modules:/app/node_modules
    command: sh -lc "pnpm --filter @ridewithme/db prisma generate && pnpm --filter @ridewithme/db prisma db push --accept-data-loss && pnpm --filter @ridewithme/db prisma db seed && pnpm --filter @ridewithme/server dev"

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: ridewithme-admin
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - server
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - ridewithme_node_modules:/app/node_modules
    command: sh -lc "pnpm --filter @ridewithme/admin dev"

volumes:
  ridewithme_pgdata:
  ridewithme_node_modules:
